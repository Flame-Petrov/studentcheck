<!DOCTYPE html>
<html lang="bg" data-default-lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Teacher Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="icon" href="images/new_main_logo.png" type="image/png">
    <!-- Reuse registration styles for class creation wizard -->
    <link rel="stylesheet" href="css/registration.css?v=1.0.0">
    <link rel="stylesheet" href="css/teacherHomepage.css?v=2.0.0">
    <link rel="stylesheet" href="css/teacherShell.css?v=1.0.0">
</head>
<body class="tp-app">

    <!-- Outline icons (Lucide-style, 24px grid), referenced with <use> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="tp-i-cap" viewBox="0 0 24 24"><path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></symbol>
        <symbol id="tp-i-currency" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15.5 8.5H11a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4H8.5"/><path d="M12 6.5v11"/></symbol>
        <symbol id="tp-i-chat" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/><path d="M8.5 10h7"/><path d="M8.5 14h4.5"/></symbol>
        <symbol id="tp-i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></symbol>
        <symbol id="tp-i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
        <symbol id="tp-i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
        <symbol id="tp-i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
        <symbol id="tp-i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
        <symbol id="tp-i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    </svg>

    <a class="tp-skip-link" href="#classesTitle" id="tpSkipLink">Към съдържанието</a>

    <div class="tp-shell">

        <!-- Sidebar on desktop; below the desktop breakpoint the brand sits in the
             top bar and the nav becomes a fixed bottom bar (pure CSS). -->
        <div class="tp-sidebar">
            <div class="tp-brand">
                <!-- .navbar-logo: shared.js attaches the slide-out menu (language, log out) to it -->
                <button class="navbar-logo tp-logo" type="button" aria-label="Home" data-custom-logo="true" onclick="handleLogoClick()">
                    <svg class="tp-logo-mark" viewBox="0 0 38 35" aria-hidden="true" focusable="false">
                        <path d="M0.6 19.6c1.3-1.5 2.7-2.6 4.2-3.4 2.6 2.2 5 4.9 7.3 8.1C18 14.6 25.6 6.6 35.4 0.4c0.9 0.5 1.7 1.2 2.2 2C28.7 10.8 21.3 21.4 15.6 34.6h-3.4C9 28.6 5.2 23.6 0.6 19.6z"/>
                    </svg>
                </button>
            </div>

            <nav class="tp-nav" id="tpNav" aria-label="Основна навигация">
                <ul class="tp-nav-list">
                    <li>
                        <a class="tp-nav-item" href="teacherHomepage.html" aria-current="page">
                            <svg class="tp-icon tp-nav-icon" aria-hidden="true"><use href="#tp-i-cap"/></svg>
                            <span class="tp-nav-label" id="tpNavClasses">Дисциплини</span>
                        </a>
                    </li>
                    <li>
                        <a class="tp-nav-item" href="billing.html">
                            <svg class="tp-icon tp-nav-icon" aria-hidden="true"><use href="#tp-i-currency"/></svg>
                            <span class="tp-nav-label" id="tpNavPayments">Плащания</span>
                        </a>
                    </li>
                    <li>
                        <button class="tp-nav-item" type="button" data-action="open-support-chat" aria-haspopup="dialog">
                            <svg class="tp-icon tp-nav-icon" aria-hidden="true"><use href="#tp-i-chat"/></svg>
                            <span class="tp-nav-label" id="tpNavChat">Чат</span>
                        </button>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="tp-content">

            <div class="tp-topbar">
                <!-- Language selector (javascript/ui/languageSelect.js) -->
                <div class="tp-lang" id="tpLang">
                    <button class="tp-lang-btn" id="tpLangBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="tpLangMenu">
                        <svg class="tp-icon tp-lang-globe" aria-hidden="true"><use href="#tp-i-globe"/></svg>
                        <span class="tp-lang-code" id="tpLangCode">BG</span>
                        <svg class="tp-icon tp-lang-chevron" aria-hidden="true"><use href="#tp-i-chevron-down"/></svg>
                    </button>
                    <ul class="tp-lang-menu" id="tpLangMenu" role="menu" aria-labelledby="tpLangBtn" hidden>
                        <li role="none">
                            <button class="tp-lang-option" type="button" role="menuitemradio" aria-checked="false" data-lang="bg" lang="bg" tabindex="-1">
                                <span>Български</span>
                                <svg class="tp-icon tp-lang-check" aria-hidden="true"><use href="#tp-i-check"/></svg>
                            </button>
                        </li>
                        <li role="none">
                            <button class="tp-lang-option" type="button" role="menuitemradio" aria-checked="false" data-lang="en" lang="en" tabindex="-1">
                                <span>English</span>
                                <svg class="tp-icon tp-lang-check" aria-hidden="true"><use href="#tp-i-check"/></svg>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>

    <main class="tp-main" id="mainContainer">

        <!-- Search Students Overlay -->
         <div class="overlay" id="searchStudentsOverlay">
            <div class="overlay-content" id="searchOverlayContent">

                <div class="overlay-content-top-section" id="overlayContentTopSection">
                    <h2 id="overlayTitle">Students</h2>
                    <div class="top-section-search-filters">

                        <!-- Filter by level -->
                         <select class="filter-select" id="filterLevel" name="filterLevel" aria-label="Level" required aria-required="true">
                            <option value="" selected>Level</option>
                            <option value="bachelor">Bachelor</option>
                            <option value="master">Master</option>
                            <option value="phd">PhD</option>
                        </select>

                        <!-- Filter by faculty -->
                        <select class="filter-select" id="filterFaculty" name="filterFaculty" aria-label="Faculty" required aria-required="true">
                            <option value="" selected>Faculty</option>
                            
                            <option value="Economics">Economics</option>
                        </select>

                        <!-- Filter by specialization -->
                         <select class="filter-select" id="filterSpecialization" name="filterSpecialization" aria-label="Specialization" required aria-required="true">
                            <option value="" selected>Specialization</option>
                            <!-- dynamically populate -->
                        </select>

                        <!-- Filter by group -->
                         <select class="filter-select" id="filterGroup" name="filterGroup" aria-label="Group" required aria-required="true">
                            <option value="" selected>Group</option>
                            <option value="37" >37</option>
                            <option value="38" >38</option>
                            <option value="39" >39</option>
                            <option value="40" >40</option>
                            <option value="41" >41</option>
                            <option value="42" >42</option>
                        </select>

                    </div>

                    <div class="top-section-search-bar-reset-filters">
                        <input type="text" id="overlaySearchInput" placeholder="Search..." aria-label="Search students" />
                        <button id="resetFiltersBtn" class="reset-filters-button" type="button">Reset</button>
                    </div>
                    
                </div>

                <div class="overlay-content-main-section" id="overlayContentMainSection">
                    <div id="overlayMainSectionBody">
                        <div id="searchAddStudentsList"></div>
                    </div>
                </div>

                <div class="overlay-content-bottom-section" id="overlayContentBottomSection">
                    <button id="searchAddStudentsOverlayBtn" class="role-button" type="button">Add Students</button>
                    <button id="closeOverlayBtn" class="role-button" type="button">Close</button>
                </div>

            </div>
        </div>



        <!-- Attendance History Overlay -->
         <div class="overlay" id="attendanceHistoryOverlay">
            <div class="attendance-history-popup" role="dialog" aria-modal="true" aria-labelledby="attendanceHistoryTitle">
                <div class="overlay-top-bar">
                    <h2 id="attendanceHistoryTitle">Attendance History</h2>
                    <button type="button" id="closeAttendanceHistoryBtn" class="close-small" aria-label="Close">×</button>
                </div>
                <div id="attendanceHistoryList" class="attendance-history-list"></div>
                <div class="manage-footer-actions">
                    <button type="button" id="attendanceHistoryBackBtn" class="role-button">Back</button>
                </div>
            </div>
         </div>



        <!-- Create Class Overlay -->
         <div class="overlay" id="createClassOverlay">
            <div class="card" role="dialog" aria-modal="true" aria-labelledby="classWizardTitle">
                <div class="card-header">
                    <div class="overlay-top-bar">
                        <h1 id="classWizardTitle" class="title">Create Class</h1>
                        <button type="button" id="createClassCloseBtn" class="close-small" aria-label="Close">×</button>
                    </div>
                </div>

                <div class="slider">
                    <div class="slides-track" id="createClassSlidesTrack">

                        <section class="slide" data-index="0" aria-label="Class Name">
                            <div class="field">
                                <label for="createClassNameInput">Name</label>
                                <input id="createClassNameInput" type="text" required />
                            </div>
                            <div id="createClassErrorName" class="error" role="alert" aria-live="polite"></div>
                        </section>

                        <section class="slide" data-index="1" aria-label="Select Students">
                            <div class="top-section-search-bar-reset-filters">
                                <input id="createClassSearchInput" type="text" placeholder="Search students..." aria-label="Search students" />
                                <button type="button" id="createClassFilterBtn" class="reset-filters-button" aria-label="Toggle filters">Filter</button>
                            </div>

                            <div id="createClassFilterPanel" class="manage-filter-panel hidden">
                                <div class="manage-filter-grid">
                                    <select class="filter-select" id="createClassFilterLevel" aria-label="Level">
                                        <option value="" selected>Level</option>
                                        <option value="bachelor">Bachelor</option>
                                        <option value="master">Master</option>
                                        <option value="phd">PhD</option>
                                    </select>
                                    <select class="filter-select" id="createClassFilterFaculty" aria-label="Faculty">
                                        <option value="" selected>Faculty</option>
                                        <option value="Economics">Economics</option>
                                    </select>
                                    <select class="filter-select" id="createClassFilterSpecialization" aria-label="Specialization">
                                        <option value="" selected>Specialization</option>
                                        <option value="Business Management">Business Management</option>
                                        <option value="Business Management 1">Business Management 1</option>
                                        <option value="Business Management 2">Business Management 2</option>
                                        <option value="Business Management in English">Business Management in English</option>
                                        <option value="Electricity Management">Electricity Management</option>
                                        <option value="Industrial Management">Industrial Management</option>
                                        <option value="Industrial Management in English">Industrial Management in English</option>
                                        <option value="Intellectual Property and Innovation">Intellectual Property and Innovation</option>
                                        <option value="Management and Business Information Systems">Management and Business Information Systems</option>
                                        <option value="Senior Management">Senior Management</option>
                                    </select>
                                    <select class="filter-select" id="createClassFilterGroup" aria-label="Group">
                                        <option value="" selected>Group</option>
                                        <option value="37">37</option>
                                        <option value="38">38</option>
                                        <option value="39">39</option>
                                        <option value="40">40</option>
                                        <option value="41">41</option>
                                        <option value="42">42</option>
                                    </select>
                                </div>
                                <div class="manage-filter-footer">
                                    <button type="button" id="createClassResetFiltersBtn" class="reset-filters-button">Reset Filters</button>
                                </div>
                            </div>

                            <div id="createClassStudentsBody"></div>
                            
                            <div id="createClassNoStudentsMsg" class="error error-hidden" aria-live="polite"></div>
                        
                        </section>
                    </div>
                </div>

                <div class="actions" id="createClassActions">
                    <button type="button" id="createClassBackBtn" class="btn btn-secondary" disabled>Back</button>
                    
                    <div class="actions-right">
                        <button type="button" id="createClassNextBtn" class="btn btn-primary">Continue</button>
                        <button type="button" id="createClassFinishBtn" class="btn btn-primary finish-hidden">Finish</button>
                    
                    </div>
                </div>

            </div>
        </div>





        <!-- Support chat is opened from the "Чат" navigation item -->
        <div id="supportChatOverlay" class="overlay" style="visibility: hidden;">
            <div class="chat-popup">
                <div class="chat-header">
                    <h2 id="supportChatTitle">Support Chat</h2>
                    <button id="supportChatLanguageBtn" class="chat-language-btn" type="button">Change Language</button>
                    <button id="closeSupportChatBtn" class="close-small" aria-label="Close">×</button>
                </div>

                <div id="chatHistoryContainer" class="chat-history"> 
                    <div class="chat-message model">Hello! I am the StudentCheck support assistant. How can I help you today?</div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Ask a question..." autocomplete="off" />
                    <button id="sendChatBtn">Send</button>
                </div>
            </div>
        </div>






        <!-- Manage Students Overlay -->
        <div class="overlay" id="manageStudentsOverlay">
            <div class="ready-class-popup" role="dialog" aria-modal="true" aria-labelledby="manageStudentsTitle">
                <div class="overlay-top-bar">
                    <h2 id="manageStudentsTitle">Students</h2>
                    <button type="button" id="closeManageOverlayBtn" class="close-small" aria-label="Close">×</button>
                </div>
                <div class="top-section-search-bar-reset-filters">
                    <input type="text" id="manageStudentsSearchInput" placeholder="Search by name, email, or faculty number..." aria-label="Search students" />
                    <button type="button" id="manageStudentsFilterBtn" class="reset-filters-button" aria-label="Filter students">Filter</button>
                </div>
                <div id="manageFilterPanel" class="manage-filter-panel hidden">
                    <div class="manage-filter-grid">
                        <select class="filter-select" id="manageFilterLevel" aria-label="Level">
                            <option value="" selected>Level</option>
                            <option value="bachelor">Bachelor</option>
                            <option value="master">Master</option>
                            <option value="phd">PhD</option>
                        </select>
                        <select class="filter-select" id="manageFilterFaculty" aria-label="Faculty">
                            <option value="" selected>Faculty</option>
                            <option value="Economics">Economics</option>
                        </select>
                        <select class="filter-select" id="manageFilterSpecialization" aria-label="Specialization">
                            <option value="" selected>Specialization</option>
                            <option value="Business Management">Business Management</option>
                            <option value="Business Management 1">Business Management 1</option>
                            <option value="Business Management 2">Business Management 2</option>
                            <option value="Business Management in English">Business Management in English</option>
                            <option value="Electricity Management">Electricity Management</option>
                            <option value="Industrial Management">Industrial Management</option>
                            <option value="Industrial Management in English">Industrial Management in English</option>
                            <option value="Intellectual Property and Innovation">Intellectual Property and Innovation</option>
                            <option value="Management and Business Information Systems">Management and Business Information Systems</option>
                            <option value="Senior Management">Senior Management</option>
                        </select>
                        <select class="filter-select" id="manageFilterGroup" aria-label="Group">
                            <option value="" selected>Group</option>
                            <option value="37">37</option>
                            <option value="38">38</option>
                            <option value="39">39</option>
                            <option value="40">40</option>
                            <option value="41">41</option>
                            <option value="42">42</option>
                        </select>
                    </div>
                    <div class="manage-filter-footer">
                        <button type="button" id="manageFilterResetBtn" class="reset-filters-button">Reset Filters</button>
                    </div>
                </div>
                <div id="manageStudentsList" class="manage-students-list"></div>
                <div class="manage-footer-actions">
                    <button type="button" id="backToReadyBtn" class="role-button">Back</button>
                    <button type="button" id="addStudentManageBtn" class="role-button" aria-label="Add Students">Add Students</button>
                </div>
            </div>
        </div>



        <!-- Add Students Overlay -->
        <div class="overlay" id="addStudentsClassOverlay">
            <div class="ready-class-popup add-students-popup" role="dialog" aria-modal="true" aria-labelledby="addStudentsTitle">
                <div class="overlay-top-bar">
                    <h2 id="addStudentsTitle">Add Students</h2>
                    <button type="button" id="closeAddStudentsClassBtn" class="close-small" aria-label="Close">×</button>
                </div>
                <div class="add-students-body">

                    <div class="top-section-search-filters">
                        <!-- Filter by level -->
                        <select class="filter-select" id="addStudentsFilterLevel" name="filterLevel" aria-label="Level" required aria-required="true">
                            <option value="" selected>Level</option>
                            <option value="bachelor">Bachelor</option>
                            <option value="master">Master</option>
                            <option value="phd">PhD</option>
                        </select>

                        <!-- Filter by faculty -->
                        <select class="filter-select" id="addStudentsFilterFaculty" name="filterFaculty" aria-label="Faculty" required aria-required="true">
                            <option value="" selected>Faculty</option>
                            <option value="Economics">Economics</option>
                        </select>

                        <!-- Filter by specialization -->
                        <select class="filter-select" id="addStudentsFilterSpecialization" name="filterSpecialization" aria-label="Specialization" required aria-required="true">
                            <option value="" selected>Specialization</option>
                            <option value="Business Management">Business Management</option>
                            <option value="Business Management 1">Business Management 1</option>
                            <option value="Business Management 2">Business Management 2</option>
                            <option value="Business Management in English">Business Management in English</option>
                            <option value="Electricity Management">Electricity Management</option>
                            <option value="Industrial Management">Industrial Management</option>
                            <option value="Industrial Management in English">Industrial Management in English</option>
                            <option value="Intellectual Property and Innovation">Intellectual Property and Innovation</option>
                            <option value="Management and Business Information Systems">Management and Business Information Systems</option>
                            <option value="Senior Management">Senior Management</option>
                        </select>

                        <!-- Filter by group -->
                        <select class="filter-select" id="addStudentsFilterGroup" name="filterGroup" aria-label="Group" required aria-required="true">
                            <option value="" selected>Group</option>
                            <option value="37" >37</option>
                            <option value="38" >38</option>
                            <option value="39" >39</option>
                            <option value="40" >40</option>
                            <option value="41" >41</option>
                            <option value="42" >42</option>
                        </select>
                    </div>

                    <div class="top-section-search-bar-reset-filters">
                        <input type="text" id="addStudentsSearchInput" placeholder="Search..." />
                        <button id="addStudentsResetFiltersBtn" class="reset-filters-button" type="button">Reset</button>
                    </div>

                    <div id="classAddStudentsList" class="add-students-list"></div>

                </div>
                <div class="add-students-footer">
                    <button type="button" id="classAddStudentsOverlayBtn" class="role-button primary" aria-label="Add Selected">Add</button>
                </div>
            </div>
        </div>



        <!-- Ready Class Overlay -->
        <div class="overlay" id="readyClassPopupOverlay">
            <div class="ready-class-popup" role="dialog" aria-modal="true" aria-labelledby="readyClassTitle">
                <div class="overlay-top-bar">
                    <h2 id="readyClassTitle">Class Ready</h2>
                    <button type="button" id="closeReadyPopupBtn" class="close-small" aria-label="Close">×</button>
                </div>
                <div class="ready-class-actions">
                    <button type="button" id="manageStudentsBtn" class="role-button primary">Manage Students</button>
                    <button type="button" id="startScannerBtn" class="role-button secondary-green">Start Scanner</button>
                    <button type="button" id="downloadAttendanceTableBtn" class="role-button primary" aria-label="Download Attendance Table">Download Attendance Table</button>
                    <button type="button" id="classOptionsBtn" class="role-button primary" aria-label="Class Options">Options</button>
                </div>
            </div>
        </div>



        <!-- Scanner Overlay (Start Scanning) -->
        <div class="overlay" id="scannerOverlay">
            <div class="ready-class-popup" role="dialog" aria-modal="true" aria-labelledby="scannerTitle">
                <div class="overlay-top-bar">
                    <h2 id="scannerTitle">Start Scanning</h2>
                    <button type="button" id="closeScannerBtn" class="close-small" aria-label="Close">×</button>
                </div>
                <div id="scannerModeGroup" class="mode-toggle-group" role="radiogroup" aria-label="Scan mode">
                    <label class="mode-toggle" for="scanJoin">
                        <input type="radio" name="scanMode" value="joining" id="scanJoin" checked>
                        <span class="mode-label">Joining</span>
                    </label>
                    <label class="mode-toggle" for="scanLeave">
                        <input type="radio" name="scanMode" value="leaving" id="scanLeave">
                        <span class="mode-label">Leaving</span>
                    </label>
                </div>
                <div id="cameraContainer" class="camera-container">
                    <div id="qr-reader"></div>
                </div>
                <div class="scanner-footer-actions">
                    <button type="button" id="scannerStopBtn" class="role-button primary">Show Attendance</button>
                    <button type="button" id="scannerDiscardBtn" class="role-button danger">Discard</button>
                    <button type="button" id="scannerCloseBtn" class="role-button secondary-green">Finish Class</button>
                </div>
            </div>
        </div>



        <!-- Attendance Overlay -->
        <div class="overlay" id="attendanceOverlay">
            <div class="ready-class-popup attendance-popup" role="dialog" aria-modal="true" aria-labelledby="attendanceTitle">
                <div class="overlay-top-bar">
                    <h2 id="attendanceTitle">Attendances</h2>
                    <button type="button" id="closeAttendanceBtn" class="close-small" aria-label="Close">×</button>
                </div>
                <div id="attendanceList" class="attendance-list"></div>
            </div>
        </div>



        <!-- Not-Ready Class Overlay -->
        <div class="overlay" id="notReadyClassOverlay">
            <div class="overlay-content" id="overlayContent">

                

            </div>
        </div>



        <section class="tp-page" id="classesSection" aria-labelledby="classesTitle">
            <h1 class="tp-title" id="classesTitle" tabindex="-1">Дисциплини</h1>

            <div class="tp-toolbar">
                <div class="tp-search" role="search">
                    <label class="tp-visually-hidden" for="classSearchInput" id="classSearchLabel">Търси дисциплина</label>
                    <svg class="tp-icon tp-search-icon" aria-hidden="true"><use href="#tp-i-search"/></svg>
                    <input class="tp-search-input" id="classSearchInput" type="search" placeholder="Търси дисциплина..." autocomplete="off" spellcheck="false" aria-controls="classList">
                </div>
                <button id="addClassBtn" type="button" class="tp-btn-primary" aria-haspopup="dialog">
                    <svg class="tp-icon tp-btn-icon" aria-hidden="true"><use href="#tp-i-plus"/></svg>
                    <span id="addClassBtnLabel">Нова дисциплина</span>
                </button>
            </div>

            <ul id="classList" class="tp-card-list" aria-labelledby="classesTitle"></ul>
            <p class="tp-empty" id="classListEmpty" hidden></p>
            <p class="tp-visually-hidden" id="classSearchStatus" role="status" aria-live="polite"></p>
        </section>

    </main>
        </div><!-- /.tp-content -->
    </div><!-- /.tp-shell -->



    <script src="javascript/shared.js"></script>
    <script src="javascript/students.js"></script>
    <script type="module" src="javascript/teacherHomepage.js"></script>
</body>
</html>
