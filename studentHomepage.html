<!DOCTYPE html>
<html lang="en" class="student-app-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Student Home</title>
    <!-- Show the requested view (#courses / #profile) before any JavaScript runs -->
    <script>
        (function () {
            var h = location.hash || '';
            var view = h === '#profile' ? 'profile' : (h.indexOf('#courses') === 0 ? 'courses' : 'qr');
            document.documentElement.setAttribute('data-sp-boot', view);
        })();
    </script>
    <link rel="stylesheet" href="css/shared.css">
    <link rel="icon" href="images/new_main_logo.png" type="image/png">
    <link rel="stylesheet" href="css/studentHomepage.css?v=2.2.0">
    <link rel="stylesheet" href="css/skeleton.css?v=1.0.0">
    <!-- Fetch the module graph in parallel instead of import-by-import -->
    <link rel="modulepreload" href="javascript/studentHomepage.js">
    <link rel="modulepreload" href="javascript/ui/index.js">
    <link rel="modulepreload" href="javascript/data/cache.js">
    <link rel="modulepreload" href="javascript/data/prefetch.js">
    <link rel="modulepreload" href="javascript/ui/skeleton.js">
</head>
<body class="student-app">

    <!-- Icons, referenced by the top and bottom navigation -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="icon-qr" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path fill="currentColor" d="M14 14h2.5v2.5H14zM17.5 17.5H20V20h-2.5zM14 17.5h2.5V20H14zM17.5 14H20v2.5h-2.5z"/></symbol>
        <symbol id="icon-book" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4.5 20.5c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></symbol>
        <symbol id="icon-idcard" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6.17 15a3 3 0 0 1 5.66 0"/><path d="M16 10h2"/><path d="M16 14h2"/></g></symbol>
        <symbol id="icon-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></g></symbol>
        <symbol id="icon-building" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/></g></symbol>
        <symbol id="icon-bookopen" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></g></symbol>
        <symbol id="icon-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g></symbol>
        <symbol id="icon-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></g></symbol>
        <symbol id="icon-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g></symbol>
        <symbol id="icon-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
    </svg>

    <header class="sp-header">
        <div class="sp-header-inner">
            <a class="sp-logo" href="#qr" data-i18n-attr="aria-label:sp_home">
                <img src="images/new_main_logo.png" alt="">
            </a>
            <nav class="sp-topnav" data-i18n-attr="aria-label:sp_main_nav">
                <a class="sp-tab" href="#qr" data-route="qr"><svg aria-hidden="true"><use href="#icon-qr"/></svg><span data-i18n="sp_nav_qr">QR code</span></a>
                <a class="sp-tab" href="#courses" data-route="courses"><svg aria-hidden="true"><use href="#icon-book"/></svg><span data-i18n="sp_nav_courses">Courses</span></a>
                <a class="sp-tab" href="#profile" data-route="profile"><svg aria-hidden="true"><use href="#icon-user"/></svg><span data-i18n="sp_nav_profile">Profile</span></a>
            </nav>
            <!-- Static so it shows before any script; shared.js wires it up -->
            <div class="sp-header-lang" id="spHeaderLang">
                <div id="languageCornerDisplay" class="language-corner-display">
                    <span class="language-corner-glyph" aria-hidden="true">🌐</span>
                    <span class="language-corner-text"></span>
                </div>
                <script>
                    try {
                        document.querySelector('#languageCornerDisplay .language-corner-text').textContent =
                            (localStorage.getItem('language') || 'en').toUpperCase();
                    } catch (e) {}
                </script>
            </div>
        </div>
    </header>

    <script>
        // Mark the requested tab as current before the page script runs
        (function () {
            var view = document.documentElement.getAttribute('data-sp-boot') || 'qr';
            document.querySelectorAll('.sp-tab[data-route="' + view + '"]').forEach(function (tab) {
                tab.setAttribute('aria-current', 'page');
            });
        })();
    </script>

    <main class="sp-main" id="spMain">

        <section class="sp-view sp-view-qr" id="viewQr" data-view="qr" aria-labelledby="qrTitle">
            <h1 class="sp-title" id="qrTitle" tabindex="-1" data-i18n="sp_my_qr">My QR</h1>
            <div class="sp-qr-card">
                <div class="sp-qr" id="qrContainer"></div>
                <p class="sp-qr-name" id="studentDisplayName"></p>
                <p class="sp-qr-fac"><span data-i18n="sp_fac_no">Fac. No.</span> <strong id="studentFacultyNumber"></strong></p>
            </div>
        </section>

        <section class="sp-view sp-courses" id="viewCourses" data-view="courses" hidden>
            <div class="sp-courses-grid" id="coursesGrid" data-mode="list">
                <div class="sp-course-list-col">
                    <h1 class="sp-title" id="coursesTitle" tabindex="-1" data-i18n="sp_courses_title">Courses</h1>
                    <div id="courseListStatus" aria-live="polite"></div>
                    <!-- Skeleton until the courses (cached or fetched) are rendered -->
                    <ul class="sp-course-list" id="courseList" data-i18n-attr="aria-label:sp_courses_title" aria-busy="true">
                        <li aria-hidden="true"><span class="sp-skeleton sp-course-skeleton"></span></li>
                        <li aria-hidden="true"><span class="sp-skeleton sp-course-skeleton"></span></li>
                        <li aria-hidden="true"><span class="sp-skeleton sp-course-skeleton"></span></li>
                    </ul>
                    <p class="sk-stale" id="courseListStale" hidden></p>
                </div>
                <section class="sp-detail" id="courseDetail" aria-labelledby="detailTitle">
                    <button class="sp-back" id="detailBack" type="button">
                        <svg aria-hidden="true"><use href="#icon-back"/></svg>
                        <span data-i18n="sp_courses_title">Courses</span>
                    </button>
                    <div id="detailBody"></div>
                </section>
            </div>
        </section>

        <section class="sp-view sp-view-profile" id="viewProfile" data-view="profile" aria-labelledby="profileTitle" hidden>
            <h1 class="sp-title" id="profileTitle" tabindex="-1" data-i18n="sp_nav_profile">Профил</h1>
            <!-- Values are filled from the session by studentHomepage.js; until
                 then they are skeleton bars sized like the final text. -->
            <p class="sp-visually-hidden" id="profileLoadingStatus" role="status" data-i18n="sp_profile_loading">Зареждане на профила…</p>
            <div class="sp-profile-grid" id="profileRegion" aria-busy="true">
                <div class="sp-card sp-identity">
                    <div class="sp-avatar" id="profileAvatar" aria-hidden="true"><span class="sp-skeleton sp-avatar-skel"></span></div>
                    <div class="sp-identity-text">
                        <p class="sp-identity-name" id="profileName"><span class="sp-skeleton sp-skel-bar" style="--sk-w:13em" aria-hidden="true"></span></p>
                        <dl class="sp-identity-meta">
                            <div class="sp-meta-item">
                                <dt><svg class="sp-field-icon" aria-hidden="true"><use href="#icon-idcard"/></svg><span data-i18n="sp_faculty_number">Факултетен номер</span></dt>
                                <dd id="profileFacultyNumber"><span class="sp-skeleton sp-skel-bar" style="--sk-w:6.5em" aria-hidden="true"></span></dd>
                            </div>
                            <div class="sp-meta-item">
                                <dt><svg class="sp-field-icon" aria-hidden="true"><use href="#icon-mail"/></svg><span data-i18n="email">Имейл</span></dt>
                                <dd id="profileEmail"><span class="sp-skeleton sp-skel-bar" style="--sk-w:12em" aria-hidden="true"></span></dd>
                            </div>
                        </dl>
                    </div>
                </div>

                <section class="sp-card sp-profile-card sp-academic" aria-labelledby="academicTitle">
                    <h2 class="sp-card-title" id="academicTitle" data-i18n="sp_academic_info">Академична информация</h2>
                    <dl class="sp-profile-list" id="profileDetails">
                        <div class="sp-profile-row">
                            <dt><svg class="sp-field-icon" aria-hidden="true"><use href="#icon-building"/></svg><span data-i18n="faculty">Факултет</span></dt>
                            <dd id="profileFaculty"><span class="sp-skeleton sp-skel-bar" style="--sk-w:10em" aria-hidden="true"></span></dd>
                        </div>
                        <div class="sp-profile-row">
                            <dt><svg class="sp-field-icon" aria-hidden="true"><use href="#icon-bookopen"/></svg><span data-i18n="specialization">Специалност</span></dt>
                            <dd id="profileSpecialization"><span class="sp-skeleton sp-skel-bar" style="--sk-w:15em" aria-hidden="true"></span></dd>
                        </div>
                        <div class="sp-profile-row">
                            <dt><svg class="sp-field-icon" aria-hidden="true"><use href="#icon-users"/></svg><span data-i18n="group">Група</span></dt>
                            <dd id="profileGroup"><span class="sp-skeleton sp-skel-bar" style="--sk-w:2.5em" aria-hidden="true"></span></dd>
                        </div>
                        <div class="sp-profile-row">
                            <dt><svg class="sp-field-icon" aria-hidden="true"><use href="#icon-calendar"/></svg><span data-i18n="course">Курс</span></dt>
                            <dd id="profileCourse"><span class="sp-skeleton sp-skel-bar" style="--sk-w:2.5em" aria-hidden="true"></span></dd>
                        </div>
                    </dl>
                </section>

                <section class="sp-card sp-profile-card sp-settings-card" aria-labelledby="settingsTitle">
                    <h2 class="sp-card-title" id="settingsTitle" data-i18n="sp_settings">Настройки</h2>
                    <div class="sp-settings">
                        <button class="sp-setting" id="profileLanguageBtn" type="button">
                            <span class="sp-setting-label"><svg class="sp-field-icon" aria-hidden="true"><use href="#icon-globe"/></svg><span data-i18n="sp_language">Език</span></span>
                            <span class="sp-setting-value" id="profileLanguageValue"></span>
                        </button>
                        <button class="sp-setting sp-logout" id="logoutBtn" type="button">
                            <span data-i18n="log_out">Изход</span>
                            <img src="icons/logout.svg" alt="" class="sp-setting-icon">
                        </button>
                    </div>
                </section>
            </div>
            <div id="profileError" hidden></div>
        </section>

    </main>

    <nav class="sp-bottomnav" data-i18n-attr="aria-label:sp_main_nav">
        <a class="sp-tab" href="#qr" data-route="qr"><svg aria-hidden="true"><use href="#icon-qr"/></svg><span data-i18n="sp_nav_qr">QR code</span></a>
        <a class="sp-tab" href="#courses" data-route="courses"><svg aria-hidden="true"><use href="#icon-book"/></svg><span data-i18n="sp_nav_courses">Courses</span></a>
        <a class="sp-tab" href="#profile" data-route="profile"><svg aria-hidden="true"><use href="#icon-user"/></svg><span data-i18n="sp_nav_profile">Profile</span></a>
    </nav>

    <!-- QR library: kjua (canvas/SVG QR renderer) -->
    <script src="javascript/vendor/kjua-0.9.0.min.js"></script>
    <script src="javascript/shared.js"></script>
    <script type="module" src="javascript/studentHomepage.js"></script>
    <script>
        // Fallback: the module renders the profile before "load". If it failed
        // to load, replace the placeholders with an error and a Retry action.
        window.addEventListener('load', function () {
            setTimeout(function () {
                var region = document.getElementById('profileRegion');
                if (!region || region.getAttribute('aria-busy') !== 'true') return;
                var bg = (document.documentElement.lang || 'bg') === 'bg';
                region.removeAttribute('aria-busy');
                document.getElementById('profileLoadingStatus').textContent = '';
                region.querySelectorAll('.sp-skeleton').forEach(function (s) { s.parentNode.textContent = '—'; });
                var box = document.getElementById('profileError');
                box.className = 'sp-state';
                box.setAttribute('role', 'alert');
                box.innerHTML = '';
                var p = document.createElement('p');
                p.textContent = bg ? 'Профилът не можа да се зареди.' : 'Your profile could not be loaded.';
                var retry = document.createElement('button');
                retry.type = 'button';
                retry.className = 'sp-button';
                retry.textContent = bg ? 'Опитай отново' : 'Try again';
                retry.addEventListener('click', function () { location.reload(); });
                box.appendChild(p);
                box.appendChild(retry);
                box.hidden = false;
            }, 0);
        });
    </script>
</body>
</html>
